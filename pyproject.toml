[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-agent"
version = "0.1.0"
description = "Anchored operating posture for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
posture = "posture.cli:main"

[tool.setuptools.package-data]
"posture.definitions" = ["*.md"]
